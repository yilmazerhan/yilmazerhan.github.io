services:
  backend:
    build:
      context: ./backend
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ssl-keyfile /ssl/current.key --ssl-certfile /ssl/current.crt
    volumes:
      - ./backend:/workspace
      - ssl_certs:/ssl
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

  celery_worker:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/workspace
    command: celery -A app.tasks.celery_app worker --loglevel=debug --concurrency=2

  frontend:
    build:
      context: ./frontend
      target: development
    command: pnpm dev --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: https://localhost:9443
