# ⚠️  SADECE YEREL GELİŞTİRME İÇİN / FOR LOCAL DEVELOPMENT ONLY
#
# Bu dosya Docker Compose tarafından otomatik yüklenir ve docker-compose.yml
# üzerine yazar. Üretim ortamında (production) KULLANILMAZ — install.sh ve
# systemd servisi açıkça "-f docker-compose.yml" ile çalışır.
#
# Geliştirici kullanımı:
#   docker compose up            → hem yml hem bu override devreye girer (HMR, --reload)
#   docker compose -f docker-compose.yml up  → sadece production stage

services:
  backend:
    build:
      context: ./backend
      target: development
    entrypoint: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/workspace
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/workspace
    command: celery -A app.tasks.celery_app worker --loglevel=debug --concurrency=2

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0 --port 80
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
