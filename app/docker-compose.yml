services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backup_data:/app/backups
      - ssl_certs:/app/ssl          # activated certs land where nginx reads them
      # Task attachments live here. Without a volume they sit in the container's
      # writable layer, so every `update.sh` (build --no-cache + up -d) silently
      # deleted them while leaving the task_attachments rows behind — the UI then
      # showed attachments whose download 404s.
      - upload_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
      - web

  celery_worker:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backup_data:/app/backups
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*worker' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  celery_beat:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    # Run the cert reload-watcher in the background, then nginx in the foreground.
    command: sh -c "sh /reload-watcher.sh & exec nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/reload-watcher.sh:/reload-watcher.sh:ro
      # Read-only: nginx only ever reads these (cert load + reload-watcher stat).
      # /ssl is mode 0777 so the non-root backend can install activated certs, and
      # unlink/rename rights come from the DIRECTORY mode — so a write foothold in
      # the internet-facing request parser could otherwise swap the TLS key pair,
      # which reload-watcher would then apply within 5s. :ro removes that vector.
      - ssl_certs:/etc/nginx/ssl:ro
    depends_on:
      ssl_init:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - web

  ssl_init:
    image: alpine/openssl:latest
    entrypoint: ["sh"]
    environment:
      SSL_EXTRA_SANS: ${SSL_EXTRA_SANS:-}
    volumes:
      - ssl_certs:/ssl
      - ./nginx/init-ssl.sh:/init-ssl.sh:ro
    command: ["/init-ssl.sh"]
    restart: "no"

volumes:
  redis_data:
  ssl_certs:
  backup_data:
  upload_data:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
