services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backup_data:/app/backups
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal
      - web

  celery_worker:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backup_data:/app/backups
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  celery_beat:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    networks:
      - web

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      ssl_init:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - web

  ssl_init:
    image: alpine/openssl:latest
    entrypoint: ["sh"]
    environment:
      SSL_EXTRA_SANS: ${SSL_EXTRA_SANS:-}
    volumes:
      - ssl_certs:/ssl
      - ./nginx/init-ssl.sh:/init-ssl.sh:ro
    command: ["/init-ssl.sh"]
    restart: "no"

volumes:
  redis_data:
  ssl_certs:
  backup_data:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
